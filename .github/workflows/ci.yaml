name: CI
on:
  push:
    branches: [main]
  pull_request:

# macOS runners are ~10x the cost/slowness of Linux (plan §4.5), so the suite is
# deliberately lean: one fast SPM unit pass that gates everything (format + build
# + test + TSan + the privacy-manifest bundle check), and a single xcodebuild
# matrix that proves the package compiles and tests on a real iOS simulator and
# on macOS. We do NOT fan the xcodebuild matrix across many OS versions — the SPM
# job already runs the full XCTest suite; xcodebuild only has to prove the
# Xcode/simulator build path works.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: formatting + SPM build + full XCTest suite + TSan + privacy check.
  # Runs first and on its own so a format slip or a unit-test failure fails in
  # ~1 min without paying for the slower xcodebuild simulator boot.
  spm:
    name: SPM (format + build + test + TSan)
    runs-on: macos-15
    # sdk-swift is checked out into a subdir so integration-test-data can sit
    # beside it, the same layout as the monorepo; every step runs from there.
    defaults:
      run:
        working-directory: sdk-swift
    steps:
      - name: Checkout sdk-swift
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: sdk-swift

      # DurationTests.testVendoredFixtureMatchesIntegrationTestData compares the
      # vendored Tests/QuonfigTests/Fixtures/duration-grammar.yaml with
      # tests/duration/grammar.yaml from a sibling integration-test-data
      # checkout, and skips when there is none. Pinned to a tag (not main) so a
      # typo in shared YAML can't break every SDK's CI at once; it must be a
      # tag that contains tests/duration/grammar.yaml.
      # See integration-test-data/RELEASING.md.
      - name: Checkout integration-test-data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          ref: v2026.10.03

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"

      - name: Swift version
        run: swift --version

      # Formatting gate (per .claude/rules/formatters.md — every SDK in the
      # family runs a formatter check in CI). swift-format ships inside the
      # Swift 6 toolchain as the `swift format` subcommand; no install needed.
      # --strict makes lint warnings fail the job. Config is .swift-format.
      - name: Check formatting (swift-format)
        run: |
          swift format lint --strict --recursive \
            --configuration .swift-format \
            Sources Tests test-swift/Sources

      - name: Build (StrictConcurrency=complete)
        run: swift build

      - name: Test
        run: swift test

      # ThreadSanitizer run (Unleash precedent — concurrency tests at high
      # contention must run clean; plan §2.10, §7.13). The actor + DispatchSource
      # poller are the data-race surface; TSan is the gate that keeps them clean.
      - name: Test (ThreadSanitizer)
        run: swift test --sanitize=thread

      # Release check (plan §1, §2.10, §6 step 6 — the Statsig trap): the privacy
      # manifest must be wired into Package.swift resources AND actually land in
      # the built resource bundle, or App Store consumers won't ship it.
      - name: Verify PrivacyInfo.xcprivacy is bundled
        run: |
          bundle_manifest=$(find .build -path '*quonfig-swift_Quonfig.bundle/PrivacyInfo.xcprivacy' | head -n1)
          if [ -z "$bundle_manifest" ]; then
            echo "::error::PrivacyInfo.xcprivacy is NOT in the built resource bundle. Check the .process() resource in Package.swift."
            exit 1
          fi
          echo "Found bundled privacy manifest: $bundle_manifest"

      # The validation / smoke app must keep compiling and running headless
      # against its in-process fixture server (test-swift/, plan §6 step 6).
      - name: Build + run test-swift validation app
        working-directory: sdk-swift/test-swift
        run: |
          swift build
          swift run TestSwiftApp

  # Cross-platform proof: the package compiles and tests through xcodebuild on a
  # real iOS simulator and on macOS. Kept to two destinations to bound macOS
  # runner cost. The iOS destination is resolved at runtime (see "Pick iOS
  # simulator") to a concrete iPhone UDID from the newest available iOS runtime,
  # so we never pin a device name that a future runner image drops.
  xcodebuild:
    name: xcodebuild (${{ matrix.name }})
    runs-on: macos-15
    needs: spm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator
            destination: "platform=iOS Simulator"  # id=<UDID> appended by "Pick iOS simulator"
          - name: macOS
            destination: "platform=macOS"
    steps:
      - name: Checkout sdk-swift
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"

      # NOTE: xcodebuild derives the scheme name from the SPM package `name:`
      # ("quonfig-swift"), NOT from the product/library name ("Quonfig").
      # `xcodebuild -list` confirms the scheme is "quonfig-swift".
      - name: Resolve package
        run: xcodebuild -resolvePackageDependencies -scheme quonfig-swift

      # Run 37978997225 failed with "Unable to find a device matching ... name:iPhone 16"
      # and xcodebuild listed NO concrete simulators at all, while a run 10 min
      # later on the identical image (macos-15-arm64 20260907.0337.1, Xcode 26.3)
      # found "iPhone 16, OS:26.2" and passed: CoreSimulator had not surfaced the
      # iOS runtime yet on that machine. So poll simctl until an iPhone shows up
      # (up to ~2 min), then pin it by UDID; fail loudly with the simctl state if
      # none ever appears.
      - name: Pick iOS simulator
        if: matrix.name == 'iOS Simulator'
        run: |
          pick() {
            xcrun simctl list devices available --json | jq -r '
              [.devices | to_entries[]
                | select(.key | test("SimRuntime\\.iOS-"))
                | select([.value[] | select(.name | startswith("iPhone"))] | length > 0)]
              | sort_by(.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber))
              | last // empty
              | [.value[] | select(.name | startswith("iPhone"))][0]
              | "\(.udid) \(.name)"'
          }
          for attempt in $(seq 1 12); do
            picked=$(pick || true)
            if [ -n "$picked" ]; then
              echo "Using simulator: $picked"
              echo "SIM_UDID=${picked%% *}" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "No available iPhone simulator yet (attempt $attempt/12); waiting 10s"
            sleep 10
          done
          echo "::error::No available iPhone simulator on this runner"
          xcrun simctl list runtimes
          xcrun simctl list devices available
          exit 1

      - name: Test (${{ matrix.name }})
        run: |
          destination="${{ matrix.destination }}"
          if [ -n "${SIM_UDID:-}" ]; then destination="$destination,id=$SIM_UDID"; fi
          xcodebuild test \
            -scheme quonfig-swift \
            -destination "$destination" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
